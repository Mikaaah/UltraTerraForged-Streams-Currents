name: Experimental UTF Water Fix V2
on:
  push:
    branches:
      - experiment/utf-waterfix-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-utf-water-fix-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream UltraTerraForged 1.21.1
        run: git clone --single-branch --depth 1 --branch 1.21.1 https://github.com/Pandaismyname1/ultraterraforged.git upstream
      - name: Apply experimental patch
        run: |\n          python3 experiments/ultraterraforged-water-fix/apply_fix.py upstream\n          python3 experiments/ultraterraforged-water-fix/apply_fix_v2.py upstream
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Regression test
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :common:test --tests '*RiverWaterTransitionTest' --tests '*WaterLevelTransitionTest' -Putf.perfMods=false --no-daemon
      - name: Build NeoForge 1.21.1 with release metadata
        working-directory: upstream
        env:
          RELEASE: 'true'
        run: ./gradlew :neoforge:build -Putf.perfMods=false --no-daemon
      - name: Stage playable JAR
        run: |
          mkdir -p release
          find upstream/neoforge/build/libs -name '*-neoforge.jar' -print
          cp upstream/neoforge/build/libs/*-neoforge.jar release/ultraterraforged-1.0.2+1.21.1-waterfix-v2-neoforge.jar
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          jar = next(Path('release').glob('*.jar'))
          with zipfile.ZipFile(jar) as archive:
              assert archive.testzip() is None
              metadata = archive.read('META-INF/neoforge.mods.toml').decode('utf-8')
              assert 'version="1.0.2+1.21.1"' in metadata, metadata
              assert 'SNAPSHOT' not in metadata, metadata
              print('Verified NeoForge mod version: 1.0.2+1.21.1')
          PY
          sha256sum release/*.jar
      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultraterraforged-1.21.1-waterfix-v2-experimental
          path: release/*.jar
          if-no-files-found: error
